<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>CoFounders Only</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap');

  :root{
    --page-bg:#FFFFFF;
    --ink:#0A0B0D;
    --black:#0A0B0D;
    --black-2:#141620;
    --white:#FFFFFF;
    --blue:#2F6FED;
    --blue-light:#3B6FE0;
    --blue-deep:#153B94;
    --green:#2ECC71;
    --btn-size:clamp(120px, 32vw, 190px);
  }

  *{margin:0;padding:0;box-sizing:border-box;}

  html,body{
    min-height:100%;
    background:var(--page-bg);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    overflow-x:hidden;
    -webkit-text-size-adjust:100%;
  }

  #app{
    position:relative;
    width:100%;
    min-height:100vh;
    min-height:100dvh;
  }

  .view{
    position:absolute;
    inset:0;
    display:none;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:2rem;
    padding-top:calc(2rem + env(safe-area-inset-top));
    padding-bottom:calc(2rem + env(safe-area-inset-bottom));
    min-height:100vh;
    min-height:100dvh;
    opacity:0;
  }

  .view.active{
    display:flex;
    position:relative;
    opacity:1;
    animation:fadeIn 0.5s ease forwards;
  }
  @keyframes fadeIn{
    from{ opacity:0; transform:scale(0.97); }
    to{ opacity:1; transform:scale(1); }
  }

  /* ---- Logo mark ---- */
  .logo-mark{
    width:clamp(60px, 12vw, 84px);
    height:clamp(60px, 12vw, 84px);
    margin-bottom:clamp(18px, 4vw, 28px);
    flex-shrink:0;
  }
  .logo-mark.small{
    width:clamp(44px, 10vw, 56px);
    height:clamp(44px, 10vw, 56px);
    margin-bottom:clamp(14px, 3vw, 20px);
  }

  /* ---- Landing view ---- */
  .wordmark{
    font-family:'Space Grotesk',sans-serif;
    font-weight:600;
    font-size:clamp(24px,7vw,42px);
    letter-spacing:0.5px;
    line-height:1.15;
    max-width:90vw;
  }
  .wordmark .only{
    color:var(--blue-light);
  }

  .tagline{
    margin-top:14px;
    font-size:clamp(12px, 3vw, 15px);
    letter-spacing:2px;
    text-transform:uppercase;
    color:rgba(10,11,13,0.55);
    font-weight:500;
  }

  .cta-box{
    position:relative;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    margin-top:clamp(32px, 7vh, 56px);
    padding:clamp(20px, 5vw, 44px);
    border:1px solid rgba(10,11,13,0.12);
    border-radius:32px;
    background:rgba(47,111,237,0.035);
  }
  .cta-box::before,
  .cta-box::after{
    content:'';
    position:absolute;
    top:50%;
    left:50%;
    width:var(--btn-size);
    height:var(--btn-size);
    border-radius:50%;
    border:1.5px solid rgba(47,111,237,0.45);
    transform:translate(-50%,-50%) scale(0.9);
    opacity:0.6;
    animation:pulseRing 2.6s ease-out infinite;
    pointer-events:none;
  }
  .cta-box::after{
    animation-delay:1.3s;
  }
  @keyframes pulseRing{
    0%{ transform:translate(-50%,-50%) scale(0.9); opacity:0.55; }
    80%{ transform:translate(-50%,-50%) scale(1.55); opacity:0; }
    100%{ opacity:0; }
  }

  .cta{
    margin-top:0;
    width:var(--btn-size);
    height:var(--btn-size);
    padding:0;
    position:relative;
    z-index:1;
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:'Inter',sans-serif;
    font-size:clamp(15px, 3.2vw, 18px);
    font-weight:600;
    letter-spacing:0.3px;
    color:var(--white);
    background:linear-gradient(180deg, var(--blue) 0%, var(--blue-deep) 100%);
    border:none;
    border-radius:50%;
    cursor:pointer;
    -webkit-tap-highlight-color:transparent;
    box-shadow:0 0 0 1px rgba(108,155,255,0.35), 0 8px 24px rgba(47,111,237,0.35);
    transition:transform 0.15s ease, box-shadow 0.15s ease;
    animation:breathe 2.6s ease-in-out infinite;
  }
  @keyframes breathe{
    0%,100%{ transform:scale(1); }
    50%{ transform:scale(1.035); }
  }
  .cta:hover{
    animation-play-state:paused;
    transform:translateY(-2px);
    box-shadow:0 0 0 1px rgba(108,155,255,0.55), 0 12px 30px rgba(47,111,237,0.5);
  }
  .cta:active{
    transform:translateY(0) scale(0.98);
  }

  .cta.ghost{
    background:transparent;
    border:1px solid rgba(10,11,13,0.2);
    color:var(--ink);
    box-shadow:none;
    padding:12px 32px;
    font-size:14px;
    width:auto;
    height:auto;
    border-radius:999px;
    animation:none;
  }
  .cta.ghost:hover{
    animation:none;
    transform:none;
    background:rgba(10,11,13,0.05);
    box-shadow:none;
  }

  /* ---- Celebration view ---- */
  .congrats{
    font-family:'Space Grotesk',sans-serif;
    font-weight:600;
    font-size:clamp(22px,6.5vw,40px);
    line-height:1.25;
    max-width:640px;
  }
  .congrats .accent{ color:var(--blue-light); }

  .sub{
    margin-top:16px;
    font-size:clamp(14px, 3.4vw, 16px);
    color:rgba(10,11,13,0.6);
    max-width:440px;
  }

  #backBtn{ margin-top:40px; }

  #landing{
    padding-bottom:clamp(40px, 16vh, 140px);
  }

  .hint{
    margin-top:18px;
    font-size:13px;
    letter-spacing:0.5px;
    color:rgba(10,11,13,0.4);
    font-style:italic;
  }

  /* ---- Flash overlay ---- */
  #flash{
    position:fixed;
    inset:0;
    background:var(--green);
    opacity:0;
    pointer-events:none;
    z-index:20;
  }
  #flash.play{
    animation:flashPulse 0.6s ease-out;
  }
  @keyframes flashPulse{
    0%{opacity:0;}
    12%{opacity:0.55;}
    100%{opacity:0;}
  }

  /* ---- Confetti ---- */
  #confetti-root{
    position:fixed;
    inset:0;
    pointer-events:none;
    overflow:hidden;
    z-index:15;
  }
  .confetti{
    position:absolute;
    top:50%;
    opacity:0;
    animation:confettiFly ease-out forwards;
  }
  @keyframes confettiFly{
    0%{
      transform:translate(0,0) rotate(0deg);
      opacity:1;
    }
    100%{
      transform:translate(var(--tx), var(--ty)) rotate(var(--rot));
      opacity:0;
    }
  }

  @media (prefers-reduced-motion: reduce){
    .view.active{ animation:none; opacity:1; }
    #flash.play{ animation:none; opacity:0.4; }
    .confetti{ display:none; }
    .cta-box::before, .cta-box::after{ animation:none; opacity:0; }
    .cta{ animation:none; }
  }

  @media (max-height:700px){
    #landing{ padding-bottom:24px; }
    .logo-mark{ margin-bottom:12px; }
    .cta-box{ margin-top:20px; }
  }

  @media (max-width:360px){
    .wordmark{ font-size:22px; }
    .tagline{ font-size:11px; letter-spacing:1.5px; }
  }
</style>
</head>
<body>

<div id="app">

  <section id="landing" class="view active">
    <svg class="logo-mark" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
      <circle cx="50" cy="50" r="47" fill="none" stroke="#2F6FED" stroke-width="2.5"/>
      <path d="M 62 30 A 22 22 0 1 0 62 70" fill="none" stroke="#0A0B0D" stroke-width="6" stroke-linecap="round"/>
      <path d="M 38 30 A 22 22 0 1 1 38 70" fill="none" stroke="#6C9BFF" stroke-width="6" stroke-linecap="round"/>
    </svg>
    <h1 class="wordmark">CoFounders<span class="only"> Only</span></h1>
    <p class="tagline">Become a CoFounder</p>
    <div class="cta-box">
      <button id="joinBtn" class="cta">Tap Here</button>
    </div>
    <p class="hint">You'll want to see this.</p>
  </section>

  <section id="celebration" class="view">
    <svg class="logo-mark small" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
      <circle cx="50" cy="50" r="47" fill="none" stroke="#2F6FED" stroke-width="2.5"/>
      <path d="M 62 30 A 22 22 0 1 0 62 70" fill="none" stroke="#0A0B0D" stroke-width="6" stroke-linecap="round"/>
      <path d="M 38 30 A 22 22 0 1 1 38 70" fill="none" stroke="#6C9BFF" stroke-width="6" stroke-linecap="round"/>
    </svg>
    <h1 class="congrats">Congratulations <span class="accent"> <br> You are now a CoFounder</span></h1>
    <p class="sub">Welcome to the table — let's build something great.</p>
    <button id="backBtn" class="cta ghost">Back to start</button>
  </section>

  <div id="flash"></div>
  <div id="confetti-root"></div>

</div>

<script>
  const landing = document.getElementById('landing');
  const celebration = document.getElementById('celebration');
  const flash = document.getElementById('flash');
  const confettiRoot = document.getElementById('confetti-root');
  const joinBtn = document.getElementById('joinBtn');
  const backBtn = document.getElementById('backBtn');

  const colors = ['#2F6FED', '#6C9BFF', '#0A0B0D', '#153B94'];

  function spawnConfetti(){
    const isSmall = window.innerWidth < 480;
    const count = isSmall ? 130 : 220;
    const w = window.innerWidth;
    const h = window.innerHeight;

    for(let i=0;i<count;i++){
      const piece = document.createElement('div');
      piece.className = 'confetti';

      const fromLeft = i % 2 === 0;
      const originX = fromLeft ? -10 : w + 10;
      const originY = h * (0.3 + Math.random()*0.4);

      const shapeType = Math.random();
      const size = 6 + Math.random()*8;
      const color = colors[Math.floor(Math.random()*colors.length)];

      if(shapeType < 0.34){
        piece.style.width = size + 'px';
        piece.style.height = size + 'px';
        piece.style.background = color;
        piece.style.borderRadius = '50%';
      } else if(shapeType < 0.67){
        piece.style.width = (size*1.8) + 'px';
        piece.style.height = (size*0.5) + 'px';
        piece.style.background = color;
      } else {
        piece.style.width = '0';
        piece.style.height = '0';
        piece.style.borderLeft = (size*0.5)+'px solid transparent';
        piece.style.borderRight = (size*0.5)+'px solid transparent';
        piece.style.borderBottom = size+'px solid ' + color;
      }

      piece.style.left = originX + 'px';
      piece.style.top = originY + 'px';

      const targetX = (fromLeft ? 1 : -1) * (w*0.35 + Math.random()*w*0.35);
      const targetY = -(h*0.15) + Math.random()*h*0.6 - h*0.3;
      const rot = (Math.random()*720 - 360) + 'deg';

      piece.style.setProperty('--tx', targetX + 'px');
      piece.style.setProperty('--ty', targetY + 'px');
      piece.style.setProperty('--rot', rot);

      const duration = 1.2 + Math.random()*1.1;
      const delay = Math.random()*0.35;
      piece.style.animationDuration = duration + 's';
      piece.style.animationDelay = delay + 's';

      confettiRoot.appendChild(piece);
      setTimeout(()=>piece.remove(), (duration+delay)*1000 + 200);
    }
  }

  joinBtn.addEventListener('click', () => {
    flash.classList.remove('play');
    void flash.offsetWidth;
    flash.classList.add('play');

    spawnConfetti();

    setTimeout(() => {
      landing.classList.remove('active');
      celebration.classList.add('active');
    }, 180);
  });

  backBtn.addEventListener('click', () => {
    celebration.classList.remove('active');
    landing.classList.add('active');
  });
</script>

</body>
</html>
